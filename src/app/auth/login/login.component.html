<mat-card class="max-w-96 mx-auto mt-10">
  <h1 mat-card-title>Login</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" type="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" />
    </mat-form-field>

    <button mat-raised-button color="primary" [disabled]="loading">Ingresar</button>
  </form>
  <div class="mt-2" *ngIf="loading"><mat-progress-spinner diameter="24" mode="indeterminate"></mat-progress-spinner></div>
</mat-card>
