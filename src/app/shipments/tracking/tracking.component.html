<mat-card>
  <h2>Buscar “Tracking”</h2>
  <form [formGroup]="form" (ngSubmit)="search()" class="flex items-end gap-3">
    <mat-form-field appearance="outline">
      <mat-label>ID de guía</mat-label>
      <input matInput formControlName="id" />
    </mat-form-field>
    <button mat-raised-button color="primary" [disabled]="loading">Buscar</button>
    <mat-progress-spinner *ngIf="loading" diameter="24" mode="indeterminate"></mat-progress-spinner>
  </form>

  <div *ngIf="result" class="mt-4">
    <h3>Estado: {{ result.status }} <span *ngIf="result.eta">| ETA: {{ result.eta | date:'short' }}</span></h3>
    <table mat-table [dataSource]="result.events" class="w-full mt-2">
      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let e">{{ e.timestamp | date:'short' }}</td>
      </ng-container>
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef> Lugar </th>
        <td mat-cell *matCellDef="let e">{{ e.location }}</td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Descripción </th>
        <td mat-cell *matCellDef="let e">{{ e.description }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['timestamp','location','description']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['timestamp','location','description'];"></tr>
    </table>
  </div>
</mat-card>
